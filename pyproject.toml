[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coastal-screening"
version = "0.2.0"
description = "Auditable process-terrain coastal screening analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pyarrow>=15,<18",
    "scipy>=1.12,<1.15",
    "xarray>=2024.1,<2025",
    "netCDF4>=1.6,<1.8",
    "rasterio>=1.3,<2",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "shapely>=2.0",
    "matplotlib>=3.8,<4",
    "Pillow>=10",
    "SciencePlots>=2.2",
    "adjustText>=1.4",
    "PyYAML>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
full = [
    "dask>=2024.1",
    "rioxarray>=0.15",
    "fiona>=1.9",
    "cartopy>=0.22",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "openmeteo-requests>=1.2",
    "retry-requests>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = [
    "error:numpy.ndarray size changed:RuntimeWarning",
    "error:numpy.dtype size changed:RuntimeWarning",
]
