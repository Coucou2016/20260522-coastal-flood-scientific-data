name: scientific-contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install contract-test dependencies
        run: >-
          python -m pip install --upgrade pip pytest numpy pandas scipy rasterio
          geopandas shapely pyproj
      - name: Run scientific contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q --import-mode=importlib
